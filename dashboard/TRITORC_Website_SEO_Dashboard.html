<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRITORC — Website Performance &amp; SEO Dashboard</title>
<style>
body[data-theme="light"]{--bg:#EDEBE3;--surface:#fff;--surface-2:#E2DFD3;--text:#1A1D23;--muted:#666B74;--accent:#D42426;--accent-soft:#F6DEDC;--border:#CFCBBC;--good:#2E7D4F;--warn:#B7791F;--bad:#B3261E;--shadow:0 1px 3px rgba(20,20,20,.08)}
body[data-theme="dark"]{--bg:#0F1216;--surface:#1C212A;--surface-2:#262D38;--text:#E9E7E0;--muted:#9098A3;--accent:#EE5557;--accent-soft:#3A1F22;--border:#343B47;--good:#5FC48A;--warn:#E3B274;--bad:#E5847A;--shadow:0 1px 3px rgba(0,0,0,.4)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;min-height:100vh}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:600;margin:0}.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
#side{width:240px;min-width:240px;background:var(--surface);border-right:1px solid var(--border);height:100vh;position:sticky;top:0;padding:20px 0;overflow-y:auto}
#brand{padding:0 20px 16px;border-bottom:1px solid var(--border);margin-bottom:10px}#brand img{height:20px;display:block}#brand .tag{color:var(--muted);font-size:12px;margin-top:8px}
.lbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 20px 4px;font-weight:600}
.nav{display:flex;gap:9px;width:100%;text-align:left;background:none;border:0;border-left:2px solid transparent;color:var(--text);padding:8px 20px;cursor:pointer;font-size:13.5px}
.nav i{font:normal 11px ui-monospace,monospace;color:var(--muted);min-width:20px}.nav:hover{background:var(--surface-2)}.nav.on{background:var(--accent-soft);border-left-color:var(--accent);color:var(--accent);font-weight:600}.nav.on i{color:var(--accent)}
#main{flex:1;min-width:0;padding:28px 40px 80px;max-width:1180px}
#top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input,textarea,button.b{font:inherit;font-size:12.5px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:6px;padding:6px 10px}
button.b{cursor:pointer}button.b:hover,select:hover{border-color:var(--accent)}button.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.eye{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}.title{font-size:25px}.desc{color:var(--muted);font-size:13.5px;margin:6px 0 4px;max-width:700px}
.note{color:var(--muted);font-size:12.5px;margin:12px 0;padding:9px 13px;background:var(--surface-2);border-left:2px solid var(--accent);border-radius:2px}
.h{font-size:14.5px;font-weight:700;margin:26px 0 10px;display:flex;gap:8px;align-items:center}.h:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:14px 16px;box-shadow:var(--shadow)}
.k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}.v{font:600 24px Georgia,serif;margin:2px 0}.v small{font:12px -apple-system,sans-serif;margin-left:6px}
.up{color:var(--good)}.dn{color:var(--bad)}.sub{font-size:12px;color:var(--muted)}.row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:3px 0}.row b{font-family:ui-monospace,monospace;font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
table{width:100%;border-collapse:collapse;font-size:12.5px}th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:7px 8px;border-bottom:1px solid var(--text);white-space:nowrap}th.s{cursor:pointer}
td{padding:7px 8px;border-bottom:1px solid var(--border);white-space:nowrap}tr.cl:hover td{background:var(--surface-2);cursor:pointer}td.n,th.n{text-align:right}.scroll{overflow-x:auto}
td select{padding:2px 4px;font-size:12px}td.w{white-space:normal;min-width:180px}
.pill{font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid var(--border)}.pill.G,.pill.Low,.pill.Resolved{color:var(--good);border-color:var(--good)}.pill.NI,.pill.Warning,.pill.Medium{color:var(--warn);border-color:var(--warn)}.pill.P,.pill.Critical,.pill.High{color:var(--bad);border-color:var(--bad)}
.hb{display:grid;grid-template-columns:140px 1fr 72px;gap:8px;align-items:center;font-size:12.5px;margin:5px 0}.hb div.t{height:9px;background:var(--surface-2);border-radius:5px}.hb div.t i{display:block;height:100%;background:var(--accent);border-radius:5px}.hb span:last-child{text-align:right;font-family:ui-monospace,monospace}
svg text{fill:var(--muted);font-size:10px}.leg{font-size:12px;color:var(--muted);margin-top:4px}.leg span{margin-right:12px}
.f{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin:10px 0}.f label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}.f input,.f select{font-size:13px}
textarea{width:100%;min-height:90px;font-family:ui-monospace,monospace}pre{background:var(--surface-2);padding:12px;border-radius:6px;font-size:11.5px;overflow:auto;margin:8px 0}
.msg{font-size:12px;margin-top:6px;color:var(--muted)}.msg.err{color:var(--bad)}.msg.ok{color:var(--good)}details{margin:8px 0;font-size:13px}summary{cursor:pointer;font-weight:600}
.al{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}.al:last-child{border:0}
.wi input{width:60px}
@media(max-width:800px){body{flex-direction:column}#side{width:100%;height:auto;position:static}#main{padding:20px}}
</style>
</head>

 $('#crumb').textContent='TRITORC / Website / '+NAV.find(n=>n[0]==VIEW)[2]+(S.demo?'':(S.fromDb?' · live data · MongoDB':' · live data · local cache (backend offline)'))+' · data through '+thru();$('#view').innerHTML=VIEWS[VIEW]()}
const ie=(id,f,v)=>{(S.ie[id]=S.ie[id]||{})[f]=v;save();go()},theme=()=>{const b=document.body;b.dataset.theme=b.dataset.theme=='light'?'dark':'light'};
function exportPages(){const rows=[...$$('#view table tr')].map(r=>[...r.children].map(c=>'"'+c.textContent.replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows],{type:'text/csv'}));a.download='tritorc-pages.csv';a.click()}
function exportCfg(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({site:S.site,reg:S.reg,w:S.w,thr:S.thr,brand:S.brand,ga4:{prop:S.src.ga4.prop},gsc:{site:S.src.gsc.site}},null,2)],{type:'application/json'}));a.download='tritorc-web-config.json';a.click()}
function importCSV(el){const f=el.files[0],m=el.closest('.card').querySelector('.msg'),ds=$('#ds').value;if(!f)return;const r=new FileReader();r.onload=()=>{try{const L=r.result.trim().split(/\r?\n/),H=L[0].split(',').map(s=>s.trim().toLowerCase()),rows=L.slice(1).map(l=>{const c=l.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(s=>s.trim().replace(/^"|"$/g,'')),o={};H.forEach((h,i)=>o[h]=c[i]);return o}),v=x=>x===''||x==null||/^n\/?a$/i.test(x)?null:+x,LV=S.live;
 if(ds=='audit')rows.forEach(o=>{const p=LV.pages[o.url]=LV.pages[o.url]||newPage(o.url);Object.assign(p,{group:o.group||p.group,pri:+o.priority||p.pri,title:o.title||p.title,kw:o.kw||p.kw});['crawl','meta','content','links','schema','other'].forEach(k=>(p.chk=p.chk||{})[k]=v(o[k]))});
 if(ds=='issues')LV.issues=rows.map(o=>({id:o.id,url:o.url,type:o.type,sev:o.severity,first:o.first_seen,last:o.last_seen,status:o.status||'Open',owner:o.owner||'SEO',evidence:o.evidence,fix:o.fix}));
 if(ds=='bl')LV.bl={provider:'CSV import',series:null,top:rows.map(o=>({domain:o.domain,auth:v(o.authority),attr:o.follow||'follow',country:o.country||'—',topic:o.topic||'—',links:v(o.links)||1,sus:/^(1|true|yes)$/i.test(o.suspicious||'')}))};
 if(ds=='conv')rows.forEach(o=>{const d=LV.daily[o.date]=LV.daily[o.date]||{};Object.assign(d,{sub:v(o.form_submissions),quote:v(o.quote),dl:v(o.downloads),wa:v(o.whatsapp),ph:v(o.phone)})});
 S.demo=false;save();m.textContent='Imported '+rows.length+' rows';m.className='msg ok'}catch(e){m.textContent='Import failed: '+e.message;m.className='msg err'}};r.readAsText(f)}
/* ============ BACKEND (MongoDB via local API) ============ */
const API_BASE='http://127.0.0.1:8790';
async function loadFromDb(){try{const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),10000);const r=await fetch(API_BASE+'/api/state',{signal:ctl.signal});clearTimeout(tm);if(!r.ok)throw new Error('HTTP '+r.status);const s=await r.json();S.live=Object.assign({},DEF.live,s.live);if(s.site)S.site=s.site;if(s.brand)S.brand=s.brand;if(s.reg)S.reg=s.reg;S.demo=false;S.fromDb=true;S.dbAt=s.generatedAt;S.dbSync=s.lastSync;return true}catch(e){S.fromDb=false;return false}}
go('exec');
loadFromDb().then(ok=>{if(ok)go()});
