<style>

#brand{padding:0 20px 16px;border-bottom:1px solid var(--border);margin-bottom:10px}#brand img{height:20px;display:block}#brand .tag{color:var(--muted);font-size:12px;margin-top:8px}

.eye{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}.title{font-size:25px}.desc{color:var(--muted);font-size:13.5px;margin:6px 0 4px;max-width:700px}
.note{color:var(--muted);font-size:12.5px;margin:12px 0;padding:9px 13px;background:var(--surface-2);border-left:2px solid var(--accent);border-radius:2px}

.k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}.v{font:600 24px Georgia,serif;margin:2px 0}.v small{font:12px -apple-system,sans-serif;margin-left:6px}
.up{color:var(--good)}.dn{color:var(--bad)}.sub{font-size:12px;color:var(--muted)}.row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:3px 0}.row b{font-family:ui-monospace,monospace;font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
table{width:100%;border-collapse:collapse;font-size:12.5px}th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:7px 8px;border-bottom:1px solid var(--text);white-space:nowrap}th.s{cursor:pointer}
td{padding:7px 8px;border-bottom:1px solid var(--border);white-space:nowrap}tr.cl:hover td{background:var(--surface-2);cursor:pointer}td.n,th.n{text-align:right}.scroll{overflow-x:auto}
body[data-view="pages"] #main,body[data-view="seo"] #main,body[data-view="cwv"] #main{max-width:none}
.cwvt th,.cwvt td{padding-left:6px;padding-right:6px}.cwvt td:first-child{white-space:normal;overflow-wrap:anywhere;word-break:break-word;min-width:200px;max-width:460px}.cwvt th{white-space:normal;line-height:1.2;vertical-align:bottom}
.ilog th,.ilog td{padding-left:6px;padding-right:6px}.ilog select{font-size:12px;padding:3px 4px}.ilog td:nth-child(2){white-space:normal;overflow-wrap:anywhere;word-break:break-word;min-width:170px;max-width:300px}.ilog td:nth-child(3){white-space:normal;min-width:120px;max-width:200px}.ilog td.w{white-space:normal;min-width:200px;max-width:320px}.ilog th{white-space:normal;line-height:1.2;vertical-align:bottom}

@media(max-width:1450px){body[data-view="pages"] #view table th{white-space:normal;line-height:1.2;vertical-align:bottom}body[data-view="pages"] #view table th:first-child,body[data-view="pages"] #view table td:first-child{min-width:150px!important}body[data-view="pages"] #view table td .pill{padding:2px 6px;font-size:10.5px}}
body[data-view="pages"] #view table th:first-child,body[data-view="pages"] #view table td:first-child{white-space:normal;overflow-wrap:anywhere;word-break:break-word;min-width:200px;max-width:440px}
td select{padding:2px 4px;font-size:12px}td.w{white-space:normal;min-width:180px}
.pill{font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid var(--border)}.pill.G,.pill.Low,.pill.Resolved{color:var(--good);border-color:var(--good)}.pill.NI,.pill.Warning,.pill.Medium{color:var(--warn);border-color:var(--warn)}.pill.P,.pill.Critical,.pill.High{color:var(--bad);border-color:var(--bad)}
.hb{display:grid;grid-template-columns:140px 1fr 72px;gap:8px;align-items:center;font-size:12.5px;margin:5px 0}.hb div.t{height:9px;background:var(--surface-2);border-radius:5px}.hb div.t i{display:block;height:100%;background:var(--accent);border-radius:5px}.hb span:last-child{text-align:right;font-family:ui-monospace,monospace}
.fbar{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin:14px 0 18px;box-shadow:0 1px 4px rgba(0,0,0,.07)}.fg{display:flex;flex-direction:column;gap:6px}.fg>label{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}.fbar .seg button{font-size:13.5px;padding:8px 16px;font-weight:500}.fbar select{font-size:13.5px;padding:9px 12px;min-width:230px;border-radius:8px}.fr{margin-left:auto;flex-direction:row;align-items:center;gap:14px}.fcount{font-size:13px;color:var(--muted)}.fcount b{font-size:22px;color:var(--text);font-weight:700}
/* neo-brutalist KPI cards: flat colour, 2px ink border, hard offset shadow */
.grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.grid>.card{background:var(--nb,#fff);color:#111;border:2px solid #111;border-radius:4px;box-shadow:5px 5px 0 #111;padding:18px 22px;min-height:138px;transition:transform .1s,box-shadow .1s}
.grid>.card:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 #111}
.grid>.card:nth-child(6n+1){--nb:#FFE27A}.grid>.card:nth-child(6n+2){--nb:#FF9EC4}.grid>.card:nth-child(6n+3){--nb:#8FE5B0}.grid>.card:nth-child(6n+4){--nb:#9ED3FF}.grid>.card:nth-child(6n+5){--nb:#FFB98A}.grid>.card:nth-child(6n+6){--nb:#C9B5FF}
.grid>.card .k{font:800 12.5px/1.2 -apple-system,"Segoe UI",Arial,sans-serif;letter-spacing:.08em;color:#111}
.grid>.card .v{font:800 40px/1.1 -apple-system,"Segoe UI",Arial,sans-serif;letter-spacing:-.02em;margin:8px 0 6px;color:#111}
.grid>.card .v small{font:700 13px -apple-system,"Segoe UI",Arial,sans-serif}
.grid>.card .sub{color:#222;font-size:13px;font-weight:500}
.grid>.card .up{color:#0B5E2E;font-weight:800}.grid>.card .dn{color:#9E1208;font-weight:800}
body[data-theme="dark"] .grid>.card{border-color:#111;box-shadow:5px 5px 0 #E9E7E0}body[data-theme="dark"] .grid>.card:hover{box-shadow:7px 7px 0 #E9E7E0}
/* neo-brutalism for every other box and control: 2px ink border + hard shadow (ink flips light in the dark theme) */
body[data-theme="light"]{--ink:#111}body[data-theme="dark"]{--ink:#E9E7E0}
.card{border:2px solid var(--ink);border-radius:4px;box-shadow:4px 4px 0 var(--ink)}
.fbar{border:2px solid var(--ink);border-radius:4px;box-shadow:4px 4px 0 var(--ink)}
.note{background:#FFF1A8;color:#111;border:2px solid #111;border-radius:4px;box-shadow:3px 3px 0 #111;font-weight:500}
select,input,textarea,button.b{border:2px solid var(--ink);border-radius:4px;font-weight:600}
button.b{box-shadow:2px 2px 0 var(--ink);transition:transform .08s,box-shadow .08s}button.b:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.seg{border:2px solid var(--ink);border-radius:4px;box-shadow:2px 2px 0 var(--ink)}.seg button{border-right:2px solid var(--ink);font-weight:700}.seg button:last-child{border-right:0}
#tt{border:2px solid var(--ink);border-radius:4px;box-shadow:5px 5px 0 var(--ink)}

.pdc{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.pdc input{font:inherit;font-size:12px;padding:5px 6px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text)}.kg{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px;margin-bottom:6px}.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.g2:has(.tc){grid-template-columns:1fr}.g2>div:has(>.tc){min-width:0}
.tcb{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:10px}.seg button:disabled{opacity:.35;cursor:not-allowed}
.dt{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}.dt input{padding:3px 6px;font-size:12px}.tcs{width:100%;height:auto;min-height:300px;display:block}.tc svg text{font-size:12px}
.sbar{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:10px 0}.sbar i{display:block;height:100%}
.gt1{grid-template-columns:1fr!important}#tt{position:fixed;z-index:9999;pointer-events:none;display:none;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.22);padding:10px 14px;font-size:13px;min-width:190px}#tt .tth{font-weight:700;font-size:14px;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--border)}#tt .ttr{display:flex;align-items:center;gap:8px;margin:4px 0}#tt .ttr b{margin-left:auto;padding-left:16px;font-size:16px}#tt .ttd{width:10px;height:10px;border-radius:50%;flex:none}#tt .ttn{margin-top:6px;font-size:11px;color:var(--muted)}.hit:hover{fill:var(--accent);fill-opacity:.3}.icb{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:8px;font-size:12px;color:var(--muted)}.icb input{padding:2px 5px;font-size:12px}.icb label{display:flex;align-items:center;gap:4px}.seg{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}.seg button{border:0;border-right:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-size:12px;padding:3px 8px;cursor:pointer}.seg button:last-child{border-right:0}.seg button.on{background:var(--accent);color:#fff}
svg text{fill:var(--muted);font-size:10px}.leg{font-size:12px;color:var(--muted);margin-top:4px}.leg span{margin-right:12px}
.f{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin:10px 0}.f label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}.f input,.f select{font-size:13px}
textarea{width:100%;min-height:90px;font-family:ui-monospace,monospace}pre{background:var(--surface-2);padding:12px;border-radius:6px;font-size:11.5px;overflow:auto;margin:8px 0}
.msg{font-size:12px;margin-top:6px;color:var(--muted)}.msg.err{color:var(--bad)}.msg.ok{color:var(--good)}details{margin:8px 0;font-size:13px}summary{cursor:pointer;font-weight:600}
.al{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}.al:last-child{border:0}
.wi input{width:60px}
@media(max-width:800px){body{flex-direction:column}#side{width:100%;height:auto;position:static}#main{padding:20px}}

 const firstD=all.length?all[0].date:'',lastD=all.length?all[all.length-1].date:'',touched=!!(c.g||c.from||c.to||c.p!=null),fmtv=o.fmt||num,axis=o.f||k0;
